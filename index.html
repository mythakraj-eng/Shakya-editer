<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050507" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Shakya Studio</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #050507;
      --surface-glass: rgba(24, 24, 28, 0.82);
      --surface-card: rgba(34, 34, 40, 0.65);
      --border-subtle: rgba(255, 255, 255, 0.09);
      --text-primary: #FAFAFC;
      --text-secondary: #9E9EA9;
      --danger-soft: #FF453A;
      --spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #171524 0%, #050507 70%);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: fixed;
      inset: 0;
    }

    /* ZONE 1: Top Utility Bar */
    .top-bar {
      height: 54px;
      padding: 8px 16px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 30;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .view-pills {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: 100px;
      padding: 3px;
      gap: 2px;
    }

    .view-pill {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 100px;
      cursor: pointer;
      transition: all 0.25s var(--spring);
    }

    .view-pill.active {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-primary);
    }

    .save-btn {
      background: var(--text-primary);
      color: #000;
      border: none;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 100px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.18);
    }

    /* ZONE 2: Interactive 9:16 Stage */
    .stage-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px 16px;
      position: relative;
      min-height: 0;
    }

    .canvas-916 {
      height: 100%;
      aspect-ratio: 9 / 16;
      max-width: 100%;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.12);
      background: #141418;
    }

    .video-scene {
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 65% 25%, rgba(244, 114, 182, 0.35), transparent 55%),
        radial-gradient(circle at 30% 75%, rgba(99, 102, 241, 0.4), transparent 60%),
        linear-gradient(165deg, #1E1B2E 0%, #0F172A 50%, #09090E 100%);
      position: relative;
      transition: transform 0.6s var(--spring), filter 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .video-scene.zoom-active { transform: scale(1.13); }

    .creator-silhouette {
      width: 130px;
      height: 170px;
      border-radius: 80px 80px 30px 30px;
      background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .creator-head { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.16); margin-bottom: 12px; }
    .creator-shoulders { width: 90px; height: 50px; border-radius: 40px 40px 16px 16px; background: rgba(255,255,255,0.1); }

    .snap-guide-v {
      position: absolute; top: 0; bottom: 0; left: 50%; width: 1px;
      background: rgba(255, 255, 255, 0.45); opacity: 0; pointer-events: none; z-index: 15;
    }
    .snap-guide-v.visible { opacity: 1; }

    .draggable-item {
      position: absolute; left: 50%; transform: translateX(-50%); cursor: grab; z-index: 20; touch-action: none;
    }

    #opening-title { top: 40px; width: 84%; text-align: center; }

    .title-pill-card {
      display: inline-flex; flex-direction: column; align-items: center;
      background: rgba(15, 15, 20, 0.78); backdrop-filter: blur(16px);
      padding: 8px 14px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .title-eyebrow { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: #C084FC; margin-bottom: 2px; }
    .title-main { font-size: 13px; font-weight: 800; color: #FFF; line-height: 1.25; }

    #subtitle-layer { top: 62%; width: 86%; text-align: center; }

    .subtitle-box {
      display: inline-block; padding: 7px 12px; border-radius: 12px;
      background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1); font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.88);
    }
    .subtitle-box .active-word {
      color: #FFF; background: linear-gradient(135deg, #8B5CF6, #6366F1);
      padding: 2px 6px; border-radius: 6px; display: inline-block;
    }

    .draggable-item.overlap-warning > div {
      border-color: var(--danger-soft) !important; box-shadow: 0 0 0 2px rgba(255, 69, 58, 0.35) !important;
    }

    .gentle-nudge {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%) translateY(-10px);
      background: rgba(28, 28, 34, 0.92); border: 1px solid rgba(255, 69, 58, 0.45);
      color: #FFD3D0; font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 100px;
      z-index: 40; opacity: 0; pointer-events: none; transition: all 0.25s var(--spring); white-space: nowrap;
    }
    .gentle-nudge.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .ig-preview-layer { position: absolute; inset: 0; pointer-events: none; z-index: 12; transition: opacity 0.3s ease; }
    .ig-preview-layer.hidden { opacity: 0; }

    .ig-right-actions { position: absolute; right: 10px; bottom: 60px; display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0.72; }
    .ig-icon-mock { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 9px; color: rgba(255, 255, 255, 0.85); }
    .ig-icon-circle { width: 26px; height: 26px; border-radius: 50%; background: rgba(255, 255, 255, 0.12); display: flex; align-items: center; justify-content: center; }

    .ig-bottom-caption {
      position: absolute; left: 10px; right: 48px; bottom: 10px; padding: 8px 10px; border-radius: 10px;
      background: rgba(0,0,0,0.45); border: 1px dashed rgba(255, 255, 255, 0.18); opacity: 0.8;
    }
    .ig-user-row { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
    .ig-avatar { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(45deg, #F59E0B, #EC4899, #8B5CF6); }
    .ig-username { font-size: 10px; font-weight: 600; }
    .ig-caption-lines { font-size: 9px; color: rgba(255,255,255,0.65); }

    .profile-fit-frame {
      position: absolute; left: 0; right: 0; top: 10.9%; bottom: 10.9%;
      border-top: 1.5px dashed rgba(255, 255, 255, 0.45); border-bottom: 1.5px dashed rgba(255, 255, 255, 0.45);
      box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.48); pointer-events: none; z-index: 14; opacity: 0; transition: opacity 0.3s ease;
    }
    .profile-fit-frame.visible { opacity: 1; }
    .profile-fit-badge {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.16); backdrop-filter: blur(12px); color: #FFF; font-size: 10px; font-weight: 600; padding: 3px 10px; border-radius: 100px;
    }

    /* ZONE 3: Scrubber */
    .timeline-area { padding: 4px 16px 8px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }

    .playback-header { display: flex; align-items: center; justify-content: space-between; }
    .play-cluster { display: flex; align-items: center; gap: 8px; }
    .play-trigger {
      width: 30px; height: 30px; border-radius: 50%; background: var(--text-primary); color: #000; border: none;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .time-pill { font-size: 11px; font-weight: 600; color: var(--text-secondary); }
    .time-pill strong { color: var(--text-primary); }
    .status-chip {
      font-size: 10px; font-weight: 500; color: #C084FC; background: rgba(192, 132, 252, 0.12);
      border: 1px solid rgba(192, 132, 252, 0.25); padding: 3px 8px; border-radius: 100px;
    }

    .scrubber-track {
      height: 38px; background: var(--surface-card); border: 1px solid var(--border-subtle);
      border-radius: 12px; position: relative; display: flex; align-items: center; padding: 0 10px; cursor: pointer; overflow: hidden;
    }
    .wave-bars { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 20px; gap: 2px; }
    .wave-bar { flex: 1; background: rgba(255, 255, 255, 0.25); border-radius: 3px; }
    .wave-bar.passed { background: rgba(255, 255, 255, 0.85); }
    .wave-bar.pause-gap { background: rgba(255, 69, 58, 0.45); height: 4px !important; }
    .wave-bar.pause-gap.cleaned { display: none; }
    .playhead-line { position: absolute; top: 4px; bottom: 4px; left: 24%; width: 2px; background: #FFF; border-radius: 4px; pointer-events: none; }

    /* ZONE 4: Dock */
    .bottom-dock-wrap { padding: 2px 12px calc(14px + env(safe-area-inset-bottom)); flex-shrink: 0; z-index: 40; }

    .glass-dock {
      background: var(--surface-glass); backdrop-filter: blur(24px); border: 1px solid var(--border-subtle);
      border-radius: 20px; padding: 6px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px;
    }
    .dock-item {
      background: transparent; border: none; color: var(--text-secondary); padding: 7px 2px;
      border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
    }
    .dock-item.active { color: var(--text-primary); background: rgba(255, 255, 255, 0.12); }
    .dock-item span { font-size: 9px; font-weight: 600; }

    .glass-sheet {
      position: absolute; left: 10px; right: 10px; bottom: 76px; background: rgba(22, 22, 28, 0.95);
      backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 24px; padding: 16px;
      z-index: 50; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85); transform: translateY(120%); opacity: 0; pointer-events: none; transition: all 0.35s var(--spring);
    }
    .glass-sheet.open { transform: translateY(0); opacity: 1; pointer-events: auto; }

    .sheet-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .sheet-title { font-size: 14px; font-weight: 700; }
    .sheet-close { background: rgba(255,255,255,0.08); border: none; color: var(--text-secondary); width: 24px; height: 24px; border-radius: 50%; cursor: pointer; }

    .feature-card {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border-subtle); border-radius: 16px;
      padding: 12px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
    }
    .feature-meta h4 { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
    .feature-meta p { font-size: 10px; color: var(--text-secondary); }

    .action-pill-btn {
      background: var(--text-primary); color: #000; border: none; font-size: 11px; font-weight: 600; padding: 7px 12px; border-radius: 100px; cursor: pointer;
    }
    .action-pill-btn.done { background: rgba(50, 215, 75, 0.2); color: #32D74B; border: 1px solid rgba(50, 215, 75, 0.4); }

    .word-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .word-chip { background: rgba(255,255,255,0.07); border: 1px solid var(--border-subtle); padding: 4px 8px; border-radius: 8px; font-size: 11px; cursor: pointer; }
    .word-chip.cut { text-decoration: line-through; opacity: 0.38; background: rgba(255, 69, 58, 0.15); }

    .style-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .style-option { background: rgba(255,255,255,0.05); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 10px; text-align: left; color: var(--text-primary); cursor: pointer; }
    .style-option.selected { border-color: #FFF; background: rgba(255,255,255,0.12); }
    .style-option small { display: block; font-size: 9px; color: var(--text-secondary); margin-top: 2px; }

    .profile-grid-preview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border-radius: 12px; overflow: hidden; margin-top: 4px; }
    .grid-tile { aspect-ratio: 4 / 5; background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--text-secondary); }
    .grid-tile.current { background: linear-gradient(160deg, #312E81, #1E1B4B); border: 1.5px solid #FFF; color: #FFF; font-weight: 700; text-align: center; padding: 3px; }

    .toast-banner {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%) translateY(-16px);
      background: rgba(255, 255, 255, 0.95); color: #000; font-size: 11px; font-weight: 600;
      padding: 7px 14px; border-radius: 100px; opacity: 0; pointer-events: none; transition: all 0.3s var(--spring); z-index: 100;
    }
    .toast-banner.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div id="toast" class="toast-banner">✨ Cleaned 1.4s of awkward silence</div>

  <!-- ZONE 1: Top Bar -->
  <div class="top-bar">
    <button class="icon-btn" title="Back">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="view-pills">
      <button id="btn-ig-preview" class="view-pill active" onclick="toggleIGPreview()">IG Preview</button>
      <button id="btn-profile-fit" class="view-pill" onclick="toggleProfileFit()">Profile Fit</button>
    </div>
    <button class="save-btn" onclick="openSheet('save')">Save</button>
  </div>

  <!-- ZONE 2: Interactive 9:16 Stage -->
  <div class="stage-wrapper">
    <div id="canvas" class="canvas-916">
      <div id="gentle-nudge" class="gentle-nudge">Hidden behind Instagram buttons</div>
      <div id="snap-v" class="snap-guide-v"></div>

      <div id="video-scene" class="video-scene">
        <div class="creator-silhouette">
          <div class="creator-head"></div>
          <div class="creator-shoulders"></div>
        </div>
      </div>

      <div id="opening-title" class="draggable-item">
        <div class="title-pill-card">
          <span class="title-eyebrow">3 Secrets</span>
          <span id="title-text" class="title-main">Why Your Reels Stop Getting Views</span>
        </div>
      </div>

      <div id="subtitle-layer" class="draggable-item">
        <div id="subtitle-box" class="subtitle-box">
          Stop posting <span class="active-word">blurry</span> videos on Instagram
        </div>
      </div>

      <div id="ig-overlay" class="ig-preview-layer">
        <div class="ig-right-actions">
          <div class="ig-icon-mock"><div class="ig-icon-circle">♥</div><span>24.8K</span></div>
          <div class="ig-icon-mock"><div class="ig-icon-circle">💬</div><span>842</span></div>
          <div class="ig-icon-mock"><div class="ig-icon-circle">↗</div><span>Share</span></div>
        </div>
        <div class="ig-bottom-caption">
          <div class="ig-user-row">
            <div class="ig-avatar"></div>
            <span class="ig-username">yourstudio</span>
          </div>
          <div class="ig-caption-lines">Your caption and music sit right here...</div>
        </div>
      </div>

      <div id="profile-fit" class="profile-fit-frame">
        <div class="profile-fit-badge">Visible on your profile grid</div>
      </div>
    </div>
  </div>

  <!-- ZONE 3: Scrubber -->
  <div class="timeline-area">
    <div class="playback-header">
      <div class="play-cluster">
        <button id="play-btn" class="play-trigger" onclick="togglePlayback()">
          <svg id="play-icon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>
        </button>
        <span class="time-pill"><strong id="time-current">0:02</strong> / <span id="time-total">0:14</span></span>
      </div>
      <span id="smart-badge" class="status-chip">2 pauses found</span>
    </div>

    <div class="scrubber-track" onclick="scrubTimeline(event)">
      <div id="wave-container" class="wave-bars"></div>
      <div id="playhead" class="playhead-line"></div>
    </div>
  </div>

  <!-- ZONE 4: Dock -->
  <div class="bottom-dock-wrap">
    <div class="glass-dock">
      <button class="dock-item" onclick="openSheet('pauses', this)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/></svg>
        <span>Pauses</span>
      </button>
      <button class="dock-item" onclick="openSheet('subtitles', this)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="4"/><path d="M6 12h4m4 0h4M6 16h8"/></svg>
        <span>Subtitles</span>
      </button>
      <button class="dock-item" onclick="openSheet('title', this)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <span>Title</span>
      </button>
      <button class="dock-item" onclick="openSheet('music', this)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span>Music</span>
      </button>
      <button class="dock-item" onclick="openSheet('cover', this)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <span>Cover</span>
      </button>
      <button class="dock-item" onclick="openSheet('vibe', this)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18"/></svg>
        <span>Vibe</span>
      </button>
    </div>
  </div>

  <div id="glass-sheet" class="glass-sheet">
    <div class="sheet-top">
      <span id="sheet-title" class="sheet-title">Trim Pauses</span>
      <button class="sheet-close" onclick="closeSheet()">✕</button>
    </div>
    <div id="sheet-body"></div>
  </div>

  <script>
    const waveContainer = document.getElementById('wave-container');
    const heights = [10, 18, 22, 14, 4, 4, 20, 24, 16, 12, 22, 19, 15, 4, 4, 18, 24, 20, 14, 16, 22, 12, 18, 14];
    heights.forEach((h, idx) => {
      const bar = document.createElement('div');
      bar.className = 'wave-bar' + (h === 4 ? ' pause-gap' : '') + (idx < 6 ? ' passed' : '');
      bar.style.height = h + 'px';
      waveContainer.appendChild(bar);
    });

    let igPreviewOn = true;
    let profileFitOn = false;
    let isPlaying = false;
    let pausesCleaned = false;
    let zoomOpening = false;
    let playProgress = 24;
    let playInterval = null;

    const words = [
      ['Stop', 'posting', 'blurry', 'videos'],
      ['Here', 'is', 'the', 'one-tap'],
      ['Instagram', 'quality', 'secret', '✨']
    ];
    let wordTick = 0;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2400);
    }

    function toggleIGPreview() {
      igPreviewOn = !igPreviewOn;
      document.getElementById('ig-overlay').classList.toggle('hidden', !igPreviewOn);
      document.getElementById('btn-ig-preview').classList.toggle('active', igPreviewOn);
    }

    function toggleProfileFit() {
      profileFitOn = !profileFitOn;
      document.getElementById('profile-fit').classList.toggle('visible', profileFitOn);
      document.getElementById('btn-profile-fit').classList.toggle('active', profileFitOn);
    }

    function togglePlayback() {
      isPlaying = !isPlaying;
      const icon = document.getElementById('play-icon');
      if (isPlaying) {
        icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        playInterval = setInterval(() => {
          playProgress = (playProgress + 2) % 100;
          updateScrubber(playProgress);
          wordTick = (wordTick + 1) % 4;
          const phrase = words[Math.floor(playProgress / 34) % words.length];
          document.getElementById('subtitle-box').innerHTML = phrase
            .map((w, i) => i === wordTick ? `<span class="active-word">${w}</span>` : w)
            .join(' ');
        }, 280);
      } else {
        icon.innerHTML = '<polygon points="6 4 20 12 6 20 6 4"/>';
        clearInterval(playInterval);
      }
    }

    function scrubTimeline(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      playProgress = Math.max(4, Math.min(96, ((e.clientX - rect.left) / rect.width) * 100));
      updateScrubber(playProgress);
    }

    function updateScrubber(pct) {
      document.getElementById('playhead').style.left = pct + '%';
      const bars = document.querySelectorAll('.wave-bar');
      const activeCount = Math.floor((pct / 100) * bars.length);
      bars.forEach((b, i) => b.classList.toggle('passed', i <= activeCount));
      const totalSec = pausesCleaned ? 12 : 14;
      const curSec = Math.floor((pct / 100) * totalSec);
      document.getElementById('time-current').textContent = `0:${curSec < 10 ? '0' + curSec : curSec}`;
    }

    function makeDraggable(el) {
      let dragging = false;
      let startX, startY, initTop, initLeft;
      const canvas = document.getElementById('canvas');
      const snapV = document.getElementById('snap-v');
      const nudge = document.getElementById('gentle-nudge');

      el.addEventListener('pointerdown', (e) => {
        dragging = true;
        el.setPointerCapture(e.pointerId);
        startX = e.clientX;
        startY = e.clientY;
        initTop = el.offsetTop;
        initLeft = el.offsetLeft;
      });

      el.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        let newTop = Math.max(16, Math.min(canvas.clientHeight - el.offsetHeight - 12, initTop + dy));
        let newLeft = initLeft + dx;

        const centerTarget = canvas.clientWidth / 2;
        if (Math.abs(newLeft - centerTarget) < 14) {
          newLeft = centerTarget;
          snapV.classList.add('visible');
        } else {
          snapV.classList.remove('visible');
        }

        el.style.top = newTop + 'px';
        el.style.left = newLeft + 'px';

        const bottomEdge = newTop + el.offsetHeight;
        const inBottomCaptionZone = bottomEdge > canvas.clientHeight - 78;
        el.classList.toggle('overlap-warning', inBottomCaptionZone);
        nudge.classList.toggle('show', inBottomCaptionZone);
      });

      el.addEventListener('pointerup', () => {
        dragging = false;
        snapV.classList.remove('visible');
      });
    }

    makeDraggable(document.getElementById('opening-title'));
    makeDraggable(document.getElementById('subtitle-layer'));

    function openSheet(type, btn) {
      document.querySelectorAll('.dock-item').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      const sheet = document.getElementById('glass-sheet');
      const title = document.getElementById('sheet-title');
      const body = document.getElementById('sheet-body');

      if (type === 'pauses') {
        title.textContent = 'Trim Awkward Pauses';
        body.innerHTML = `
          <div class="feature-card">
            <div class="feature-meta">
              <h4>Instant Flow</h4>
              <p>Automatically tighten 1.4s of dead air</p>
            </div>
            <button class="action-pill-btn ${pausesCleaned ? 'done' : ''}" onclick="cleanPauses(this)">
              ${pausesCleaned ? '✓ Cleaned' : 'Clean Up'}
            </button>
          </div>
          <div class="word-chips">
            <span class="word-chip" onclick="cutWord(this)">"Um..."</span>
            <span class="word-chip" onclick="cutWord(this)">Stop posting</span>
            <span class="word-chip" onclick="cutWord(this)">blurry videos</span>
            <span class="word-chip" onclick="cutWord(this)">"like, you know"</span>
          </div>
        `;
      } else if (type === 'subtitles') {
        title.textContent = 'Subtitle Style';
        body.innerHTML = `
          <div class="style-grid">
            <button class="style-option selected" onclick="setSubStyle('glow', this)">
              <strong>Studio Pill</strong><small>Soft glass + glowing word</small>
            </button>
            <button class="style-option" onclick="setSubStyle('minimal', this)">
              <strong>Clean Editorial</strong><small>Crisp white cinema text</small>
            </button>
            <button class="style-option" onclick="setSubStyle('bold', this)">
              <strong>Creator Pop</strong><small>High-impact yellow accent</small>
            </button>
            <button class="style-option" onclick="setSubStyle('off', this)">
              <strong>Hide Subtitles</strong><small>Clean video only</small>
            </button>
          </div>
        `;
      } else if (type === 'title') {
        title.textContent = 'Opening Title';
        body.innerHTML = `
          <div class="feature-card">
            <div class="feature-meta">
              <h4>Gentle Zoom-In</h4>
              <p>Subtle camera push in first 3 seconds</p>
            </div>
            <button class="action-pill-btn ${zoomOpening ? 'done' : ''}" onclick="toggleZoom(this)">
              ${zoomOpening ? '✓ Active' : 'Turn On'}
            </button>
          </div>
        `;
      } else if (type === 'music') {
        title.textContent = 'Use Sound from Any Reel';
        body.innerHTML = `
          <div class="feature-card">
            <div class="feature-meta">
              <h4>Pull Sound from Camera Roll</h4>
              <p>Pick any saved video to extract its audio</p>
            </div>
            <button class="action-pill-btn" onclick="showToast('🎵 Sound imported')">Choose Video</button>
          </div>
        `;
      } else if (type === 'cover') {
        title.textContent = 'How It Looks on Your Profile';
        body.innerHTML = `
          <div class="profile-grid-preview">
            <div class="grid-tile current">Why Your Reels Stop...</div>
            <div class="grid-tile">Last Reel</div>
            <div class="grid-tile">Pinned Post</div>
          </div>
        `;
      } else if (type === 'vibe') {
        title.textContent = 'Color Vibe';
        body.innerHTML = `
          <div class="style-grid">
            <button class="style-option selected" onclick="setVibe('none', this)"><strong>Natural</strong><small>True to camera</small></button>
            <button class="style-option" onclick="setVibe('contrast(1.12) saturate(1.18)', this)"><strong>Crisp Studio</strong><small>Rich & punchy</small></button>
            <button class="style-option" onclick="setVibe('sepia(0.22) contrast(1.08)', this)"><strong>Golden Hour</strong><small>Warm tones</small></button>
            <button class="style-option" onclick="setVibe('grayscale(0.85) contrast(1.2)', this)"><strong>Monochrome</strong><small>Black & white</small></button>
          </div>
        `;
      } else if (type === 'save') {
        title.textContent = 'Ready for Instagram';
        body.innerHTML = `
          <div class="feature-card">
            <div class="feature-meta">
              <h4>Crystal-Clear Quality</h4>
              <p>Tuned so Instagram never blurs your video</p>
            </div>
            <span class="status-chip">Auto-Tuned</span>
          </div>
          <button class="save-btn" style="width:100%; padding:13px; font-size:14px;" onclick="finishSave()">
            Save to Phone & Open Instagram
          </button>
        `;
      }

      sheet.classList.add('open');
    }

    function closeSheet() {
      document.getElementById('glass-sheet').classList.remove('open');
      document.querySelectorAll('.dock-item').forEach(b => b.classList.remove('active'));
    }

    function cleanPauses(btn) {
      pausesCleaned = !pausesCleaned;
      document.querySelectorAll('.pause-gap').forEach(g => g.classList.toggle('cleaned', pausesCleaned));
      document.getElementById('time-total').textContent = pausesCleaned ? '0:12' : '0:14';
      document.getElementById('smart-badge').textContent = pausesCleaned ? '✨ Pauses cleaned' : '2 pauses found';
      btn.textContent = pausesCleaned ? '✓ Cleaned' : 'Clean Up';
      btn.classList.toggle('done', pausesCleaned);
      if (pausesCleaned) showToast('✨ Cleaned 1.4s of awkward silence');
    }

    function cutWord(chip) {
      chip.classList.toggle('cut');
      showToast('✂️ Moment trimmed');
    }

    function setSubStyle(style, btn) {
      document.querySelectorAll('#sheet-body .style-option').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      const layer = document.getElementById('subtitle-layer');
      const box = document.getElementById('subtitle-box');
      layer.style.display = style === 'off' ? 'none' : 'block';
      if (style === 'minimal') {
        box.style.background = 'transparent';
        box.style.borderColor = 'transparent';
      } else if (style === 'bold') {
        box.style.background = 'rgba(0,0,0,0.82)';
        box.style.borderColor = '#FACC15';
      } else {
        box.style.background = 'rgba(0,0,0,0.55)';
        box.style.borderColor = 'rgba(255,255,255,0.1)';
      }
    }

    function toggleZoom(btn) {
      zoomOpening = !zoomOpening;
      document.getElementById('video-scene').classList.toggle('zoom-active', zoomOpening);
      btn.textContent = zoomOpening ? '✓ Active' : 'Turn On';
      btn.classList.toggle('done', zoomOpening);
    }

    function setVibe(filterVal, btn) {
      document.querySelectorAll('#sheet-body .style-option').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('video-scene').style.filter = filterVal;
    }

    function finishSave() {
      closeSheet();
      showToast('🎉 Saved in crystal-clear quality!');
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
